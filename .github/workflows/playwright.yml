name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false 
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright Browsers
        run: npx playwright install ${{ matrix.browser }} --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}

      # Сохраняем сырые результаты для каждого браузера отдельно
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          retention-days: 1
  generate-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Нам нужен Node.js во второй джобе, чтобы установить allure-commandline через npm
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Скачиваем все уникальные папки и сливаем их в одну (allure-results)
      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      # Ручная установка Allure CLI
      - name: Install Allure CLI
        run: npm install -g allure-commandline

      # Ручная генерация отчета
      - name: Generate Allure Report
        run: allure generate ./allure-results --clean -o allure-report

      # Публикуем сгенерированную папку (allure-report) на GitHub Pages
      - name: Deploy Allure to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
